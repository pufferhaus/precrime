name: ci

on:
  push:
    branches: [main, phase1-software]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Stub libndi linking — CI doesn't have the NewTek SDK installed.
  PRECRIME_NDI_STUB: "1"
  # Pedantic clippy lints are configured as warn in workspace Cargo.toml.
  # We don't gate CI on them (too noisy) — they show in the run output but
  # don't fail the build. Real rustc warnings still surface.

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libcairo2-dev \
            libudev-dev \
            pkg-config

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        # Pedantic warnings are noisy on this codebase; we keep them as warn
        # locally but don't gate CI on them. Default clippy still applies.
        run: cargo clippy --all-targets

      - name: cargo check
        run: cargo check --all-targets

      - name: cargo test
        run: cargo test --all-targets
