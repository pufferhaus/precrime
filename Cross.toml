# Cross.toml is used by `cross check` in CI (ubuntu-latest, x86_64).
# Local builds on Apple Silicon use `docker run precrime-cross:aarch64` directly
# (see Makefile) — cross forces --platform linux/amd64 which breaks on arm64 hosts.
#
# The pre-build step installs the aarch64 dev headers the cross container needs
# to resolve gstreamer-rs / cairo-rs pkg-config at compile-check time.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update",
    "apt-get install --assume-yes --no-install-recommends libgstreamer1.0-dev:$CROSS_DEB_ARCH libgstreamer-plugins-base1.0-dev:$CROSS_DEB_ARCH libcairo2-dev:$CROSS_DEB_ARCH pkg-config",
]
